<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#12212b;--mute:#5d6f7a;--line:#dbe4e8;--brand:#0e7c86;--brand2:#e3f4f5;--red:#d92d20;--red2:#fdecea;--amber:#b54708;--amber2:#fff4e5;--user:#12212b;--userink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171d;--card:#16232b;--ink:#e8f0f3;--mute:#95a8b2;--line:#27394382;--brand:#35c2cd;--brand2:#12343a;--red:#ff6b5e;--red2:#3a1a17;--amber:#ffb870;--amber2:#37270f;--user:#35c2cd;--userink:#08262a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:Cairo,Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;max-width:720px;margin:0 auto;font-size:16px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
header .logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
header h1{font-size:16px;margin:0;line-height:1.2}header small{color:var(--mute)}
#back{margin-inline-start:auto;border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:4px 12px;font:inherit;cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 2px;font:inherit;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:20px;line-height:1.2}nav button.on{color:var(--brand);font-weight:800}
nav button.sos{color:var(--red);font-weight:800}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:16px}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.red{background:var(--red);color:#fff}.btn.ghost{background:var(--brand2);color:var(--brand)}
.btn.big{width:100%;text-align:center;font-size:18px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;line-height:1.35}
.tile i{display:block;font-style:normal;font-size:28px;margin-bottom:4px}
.tile:hover{border-color:var(--brand)}
.hero{background:var(--red2);border:1px solid var(--red);border-radius:16px;padding:14px;margin-bottom:12px}
.hero h2{margin:0 0 4px;color:var(--red);font-size:18px}
.note{background:var(--amber2);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.tag{display:inline-block;background:var(--brand2);color:var(--brand);border-radius:99px;padding:2px 10px;font-size:13px;margin:2px}
ul,ol{margin:4px 0;padding-inline-start:22px}
.sec{border-inline-start:4px solid var(--brand);padding-inline-start:10px;margin:12px 0}
.sec.no{border-color:var(--red)}.sec.ask{border-color:var(--amber)}
.sec h4{margin:0}
/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.m{max-width:88%;padding:10px 14px;border-radius:18px}
.m.u{align-self:flex-start;background:var(--user);color:var(--userink);border-end-start-radius:4px}
.m.a{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-end-end-radius:4px}
.m.a.alert{background:var(--red2);border-color:var(--red)}
.m img{max-width:100%;border-radius:12px;display:block;margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 12px;font-size:13px;cursor:pointer}
.composer{display:flex;gap:6px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 8px;margin-top:6px}
.composer textarea{flex:1;border:0;background:none;resize:none;max-height:90px;padding:6px;outline:none}
.ib{border:0;background:var(--brand2);color:var(--brand);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
.ib.send{background:var(--brand);color:#fff}
/* forms */
label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}
input[type=text],input[type=date],input[type=time],input[type=tel],input[type=number],select,textarea.f{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.body-map{display:block;margin:auto;max-width:210px;width:60%}
.z{fill:var(--brand2);stroke:var(--brand);stroke-width:2;cursor:pointer}.z:hover,.z.on{fill:var(--brand);fill-opacity:.6}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px;z-index:20}
.modal .card{max-width:420px;margin:0}
.vid{aspect-ratio:16/9;background:#0b1a20;border-radius:12px;display:grid;place-items:center;color:#9fb3bc;font-size:40px;margin-bottom:8px}

#mode,#menu{border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
#mode{margin-inline-start:auto}#back{margin-inline-start:0}#menu{border:0;font-size:22px;padding:0 4px}
.welcome{display:none}
body[data-mode=chat]{--bg:#fff;--card:#fff;--ink:#0d0d0d;--mute:#6b6b6b;--line:#e5e5e5;--brand:#10a37f;--brand2:#f0f0f0;--user:#f0f0f0;--userink:#0d0d0d}
@media (prefers-color-scheme:dark){body[data-mode=chat]{--bg:#212121;--card:#2a2a2a;--ink:#ececec;--mute:#a0a0a0;--line:#3a3a3a;--brand:#19c37d;--brand2:#343434;--user:#303030;--userink:#ececec;--red2:#3a1a17}}
body[data-mode=chat] nav{display:none}body[data-mode=chat]::before{background:var(--bg)}body[data-mode=chat] header{background:var(--bg);border:0}
body[data-mode=chat] .logo{background:none;color:var(--ink);font-size:22px;border:1px solid var(--line)}
body[data-mode=chat] .m{max-width:100%}body[data-mode=chat] .m.u{background:var(--user);color:var(--userink);border-radius:20px;max-width:85%;border:0}
body[data-mode=chat] .m.a{background:none;border:0;padding-inline:2px;align-self:stretch;max-width:100%}
body[data-mode=chat] .m.a.alert{background:var(--red2);border:1px solid var(--red);padding:10px 14px;border-radius:16px}
body[data-mode=chat] .composer{border-radius:26px;background:var(--brand2);border:0;padding:8px 10px}
body[data-mode=chat] .ib{background:none;color:var(--ink)}body[data-mode=chat] .ib.send{background:var(--ink);color:var(--bg)}
body[data-mode=chat] .chip{border-radius:14px;background:none}
body[data-mode=chat] .btn{background:var(--ink);color:var(--bg)}body[data-mode=chat] .btn.ghost{background:var(--brand2);color:var(--ink)}body[data-mode=chat] .btn.red{background:var(--red);color:#fff}
body[data-mode=chat] .tag{background:var(--brand2);color:var(--ink)}body[data-mode=chat] .z{fill:var(--brand2);stroke:var(--mute)}
body[data-mode=chat] .welcome{display:block;text-align:center;margin:6vh 0 14px}.welcome h2{font-size:26px;margin:0}

#drawer .pn button:hover{background:var(--brand2)}#drawer h5{margin:12px 12px 4px;color:var(--mute);font-weight:600}
</style></head><body>

 $("#main").innerHTML=h;
}

 else if(W.s===1){h=bar+`<h2>هل توجد علامة خطر؟</h2><p style="color:var(--mute);margin-top:0">حدّد أي علامة موجودة الآن.</p>`+FLAGS.map(f=>`<label style="font-weight:400;display:flex;gap:10px;align-items:center;padding:8px 12px;margin:6px 0" class="card"><input type="checkbox" class="rf" onchange="chk()"> ${f}</label>`).join("")+`<div id="rfres"></div><div class="row" style="margin-top:14px"><button class="btn" id="go1" style="flex:1" onclick="W.s=2;route()">لا توجد أي علامة — متابعة</button></div>`}
 else if(W.s===2){h=bar+`<h2>أين مكان الإصابة؟</h2><div class="grid">${Object.keys(ZN).map(k=>`<div class="tile" onclick="W.z='${k}';W.s=3;route()"><i>${ZE[k]}</i>${ZN[k]}</div>`).join("")}<div class="tile" onclick="W.z='';W.s=3;route()"><i>❓</i>غير متأكد</div></div><div class="row" style="margin-top:14px">${prev}</div>`}
 else if(W.s===3){const first=W.z?ZONES[W.z]:[];const all=[...first,...INJ.map(i=>i.id).filter(x=>!first.includes(x))];h=bar+`<h2>ما نوع الإصابة؟</h2>${W.z?`<p style="color:var(--mute);margin-top:0">الأقرب لـ ${ZN[W.z]} أولاً.</p>`:""}<div class="grid">${all.map(id=>`<div class="tile" onclick="W.i='${id}';W.s=4;route()"><i>${inj(id).e}</i>${inj(id).n}</div>`).join("")}</div><div class="row" style="margin-top:14px">${prev}</div>`}
 else if(W.s===4){h=bar+`<h2>تفاصيل الإصابة</h2><div class="note">الصورة اختيارية. تعطي ملاحظات عامة فقط ولا تؤكد تشخيصاً.</div><div class="row"><button class="btn" onclick="$('#file').setAttribute('capture','environment');$('#file').click()">📷 التقاط صورة</button><button class="btn ghost" onclick="$('#file').removeAttribute('capture');$('#file').click()">🖼️ رفع صورة</button></div>${W.photo?`<img src="${W.photo}" alt="صورة الإصابة" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px">`:""}<div class="row"><div style="flex:1"><label>التاريخ</label><input type="date" id="wd" value="${W.d}"></div><div style="flex:1"><label>الوقت</label><input type="time" id="wt" value="${W.t}"></div></div><label>الأعراض</label><textarea class="f" id="ws" rows="3" placeholder="ألم، تورم، تنميل...">${esc(W.sym)}</textarea><div class="row" style="margin-top:14px">${prev}<button class="btn" style="flex:1" onclick="saveW();if(EMG.test(W.sym)){W.s=0}else{W.s=5;W.st=0}route()">عرض الإسعاف</button></div>`}
 else{const i=inj(W.i),n=i.st.length,k=W.st;
  h=bar+`<h2>${i.e} ${i.n}</h2>`+(i.urgent?`<div class="hero"><b>⚠️ ${i.urgent}</b><div style="margin-top:8px">${callBtn()}</div></div>`:"");
  if(k<n){h+=`<div class="card" style="text-align:center;padding:22px"><small style="color:var(--mute)">الإجراء ${k+1} من ${n}</small><p style="font-size:20px;font-weight:600;margin:10px 0">${i.st[k]}</p></div><div class="row">${k?`<button class="btn ghost" onclick="W.st--;route()">السابق</button>`:`<button class="btn ghost" onclick="W.s=4;route()">رجوع</button>`}<button class="btn" style="flex:1" onclick="W.st++;route()">${k===n-1?"إنهاء الخطوات":"التالي"}</button></div>`}
  else{const ul=a=>"<ul>"+a.map(x=>`<li>${x}</li>`).join("")+"</ul>";h+=`${W.photo?`<img src="${W.photo}" alt="" style="width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:8px"><p style="font-size:14px;color:var(--mute)">ملاحظات بصرية عامة: تحقق من التورم وتغيّر اللون والتشوّه والجرح المفتوح. لا يمكن تأكيد التشخيص من الصورة.</p>`:""}<div class="card"><div class="sec no"><h4>تجنّب</h4>${ul(i.av)}</div><div class="sec ask"><h4>اطلب المساعدة الطبية إذا</h4>${ul(i.sk)}</div></div><div class="row"><button class="btn" onclick="saveStart()">📋 حفظ في السجل</button><button class="btn ghost" onclick="video('${i.n}')">▶ فيديو</button><button class="btn ghost" onclick="expert('${i.n}')">👨‍⚕️ مختص</button><button class="btn ghost" onclick="go('injury/${i.id}')">📖 الدليل</button></div><div class="row" style="margin-top:10px"><button class="btn ghost" onclick="W.st=0;route()">إعادة الخطوات</button><button class="btn ghost" onclick="W=newW();route()">حالة جديدة</button></div><p style="color:var(--mute);font-size:13px">${WARN}</p>`}}
 $("#main").innerHTML=h;
}
window.saveStart=()=>{const L=store.get("log",[]);L.unshift({id:Date.now(),inj:W.i,zone:W.z,date:W.d,time:W.t,sym:W.sym,photo:W.photo,ups:[]});store.set("log",L);W=newW();go("log")};
function setMode(m){MODE=m;store.set("mode",m);document.body.dataset.mode=m;$("#menu").hidden=m!=="chat";$("#mode").textContent=m==="chat"?"🖥️ كلاسيكي":"💬 شات"}
window.toggleMode=()=>{setMode(MODE==="chat"?"classic":"chat");const h=MODE==="chat"?"#aid":"#home";if(location.hash===h)route();else location.hash=h};
const items=[["aid","💬 محادثة جديدة"],["start","▶️ خطوات الإسعاف"],["massage","💆 التدليك"],["body","🧍 مكان الإصابة"],["photo","📷 تصوير الإصابة"],["log","📋 سجل الإصابات"],["sos","🚨 الطوارئ"],["home","📖 كل الإصابات"]];
$("#dp").innerHTML=items.map(([k,t])=>`<button onclick="${k==='aid'?"chat=[];":""}go('${k}');route()">${t}</button>`).join("")+"<h5>الإصابات</h5>"+INJ.map(i=>`<button onclick="go('injury/${i.id}')">${i.e} ${i.n}</button>`).join("");
$("#menu").onclick=()=>$("#drawer").classList.add("open");$("#drawer .sh").onclick=()=>$("#drawer").classList.remove("open");
$("#mode").onclick=toggleMode;setMode(MODE);
window.startMassage=()=>{M={s:1,a:""};go("massage")};
window.pick=m=>{setMode(m);document.querySelector(".modal")?.remove();location.hash=m==="chat"?"#aid":"#home";route()};
if(FIRST){modal(`<h3>اختر طريقة الاستعمال</h3><p style="margin-top:0;color:var(--mute)">يمكنك التبديل في أي وقت من الزر أعلى الصفحة.</p><button class="btn big" style="margin-bottom:8px" onclick="pick('classic')">🖥️ تطبيق كلاسيكي بخطوات</button><button class="btn big" onclick="pick('chat')" style="background:var(--ink);color:var(--bg)">💬 شات محدّث</button>`);document.getElementById("mc")?.remove()}
route();
</script>
</body></html>
